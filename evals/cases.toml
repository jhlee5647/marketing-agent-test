# 평가 케이스. 사람이 읽고 고치는 파일이다. 여섯 유형 × 3개.
#
# 자리표시자: `{이름}`은 아래 [placeholders]의 SQL 첫 컬럼, `{이름:컬럼}`은 지정한 컬럼의 값으로
# 평가 실행 시점에 렌더링된다. 상품명을 박아 쓰지 않는 이유는 적재 규모가 바뀌어도 같은 의미의
# 케이스로 남게 하기 위해서다.
#
# 기대값: `expected_sql`은 평가 실행 시점에 적재 데이터에서 돌린다. 그 결과의 모든 값이 답변에
# 있어야 통과다. 상품명처럼 에이전트가 줄이거나 옮겨 쓸 수 있는 값은 기대 SQL에 넣지 않는다.
# 자릿수는 `ROUND`로 정한다. 답변이 더 거칠게 반올림해도 두 자릿수가 가리키는 범위가 겹치면 통과다.
#
# 금지 패턴: 답변 채점이 볼 수 없는 잘못만 겨냥한다. 집계 케이스는 기대 SQL이 답의 정확성을 이미
# 보장하므로, 에이전트가 중간에 엉뚱한 조회를 했다가 스스로 고쳐도 문제가 아니다. 그런 탐색까지
# 잡으면 회귀 신호 대신 잡음이 는다. 반대로 "상품 필터 없이 검색했다" 같은 잘못은 답변만 봐서는
# 알 수 없으므로 금지 패턴이 필요하다.
#
# `human_label`: 사람이 직접 매긴 통과·실패. 심판의 판정이 이것과 얼마나 맞는지로 심판을 믿어도
# 되는지 잰다. 실제 답변을 읽고 매긴 값이다.
#
# `scale_dependent = true`는 **상품 자리표시자를 쓰는 루브릭 케이스**에만 붙인다. 적재 범위나 상위 N을
# 바꾸면 자리표시자가 가리키는 상품이 달라지고, 그 상품의 리뷰에 무엇이 들어 있는지도 달라져서 루브릭이
# 여전히 맞는지 사람이 다시 봐야 하기 때문이다. 자리표시자를 쓰더라도 기대 SQL이나 거절로 채점하는
# 케이스는 실행 시점에 값이 다시 풀리므로 사람이 볼 것이 없고, 주제 케이스는 루브릭이 내용이 아니라
# 개수와 형식만 보므로 적재 범위와 무관하게 성립한다. 둘 다 이 플래그가 붙지 않는다.
#
# 범위 밖 케이스는 **적재 범위를 사다리 끝(Skin Care 전량)까지 넓혀도 범위 밖인 것만** 묻는다. 2023년
# 한정은 상수이고, 헤어 계열은 적재 범위가 영영 닿지 않는 Skin Care의 형제 가지이며, 비뷰티 상품은
# 원본 파일(Beauty & Personal Care) 자체에 없다. 규모마다 케이스 집합이 달라지면 점끼리 비교할 수 없다.

[placeholders."리뷰 수 1위 상품"]
sql = """
SELECT products.title, parent_asin FROM products JOIN reviews USING (parent_asin)
GROUP BY parent_asin ORDER BY COUNT(*) DESC, parent_asin LIMIT 1
"""

[placeholders."리뷰 수 2위 상품"]
sql = """
SELECT products.title, parent_asin FROM products JOIN reviews USING (parent_asin)
GROUP BY parent_asin ORDER BY COUNT(*) DESC, parent_asin LIMIT 1 OFFSET 1
"""

